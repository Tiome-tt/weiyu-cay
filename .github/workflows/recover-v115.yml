name: Recover v1.1.5 macOS release assets
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify signed tag and original platform gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          source=b1ae839a8e9b09393235f4d3f08dc146900fbade
          tag="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.5" --jq .object.sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" | jq -e --arg source "$source" '.tag == "v1.1.5" and .verification.verified and .object.sha == $source'
          gh run view 41571289999 -R "$GITHUB_REPOSITORY" --json headSha,jobs | jq -e --arg source "$source" '.headSha == $source and ([.jobs[] | select(.conclusion == "success") | .name] | (index("verify-tag") != null and index("full CI gates (windows-latest)") != null and index("full CI gates (macos-latest)") != null and ([.[] | select(startswith("build (windows-latest"))] | length == 2)))'
          gh release view v1.1.5 -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName | jq -e '.isDraft and (.isPrerelease | not) and .tagName == "v1.1.5"'
  build:
    needs: verify-source
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    env:
      VITE_CAY_LOCALE: ${{ matrix.locale }}
    strategy:
      fail-fast: false
      # Asset names are disjoint; generate shared manifests only after all builds.
      max-parallel: 4
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: universal-apple-darwin
            locale: zh-CN
            args: '--target universal-apple-darwin --bundles app,dmg'
          - os: macos-latest
            platform: macos
            target: universal-apple-darwin
            locale: en-US
            args: '--target universal-apple-darwin --bundles app,dmg'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/v1.1.5
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 11.21.0
      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --store-dir "${{ runner.temp }}/pnpm-store"
      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Materialize release-only updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_STAGING_ENDPOINT: ${{ vars.RELEASE_STAGING_ENDPOINT }}
          RELEASE_CHANNEL: stable
          TAG_NAME: v1.1.5
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          const publicKey = process.env.TAURI_UPDATER_PUBLIC_KEY?.trim()
          if (!publicKey || publicKey.includes('PRIVATE KEY') || publicKey.includes('\n')) {
            throw new Error('A real release-owner updater public key is required.')
          }
          const required = ['TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD']
          for (const name of required) if (!process.env[name]?.trim()) throw new Error(`${name} is required for a signed release.`)
          const repository = process.env.GITHUB_REPOSITORY
          const tagName = process.env.TAG_NAME
          const channel = process.env.RELEASE_CHANNEL
          const staging = process.env.RELEASE_STAGING_ENDPOINT?.trim().replace(/\/$/, '')
          if (!repository || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository) || !tagName || !/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tagName)) {
            throw new Error('Release repository or tag is invalid.')
          }
          if (channel !== 'stable' && channel !== 'rc') throw new Error('Release channel is invalid.')
          if (channel === 'rc' && (!staging || !/^https:\/\/[^/?#]+(?:\/[^?#]*)?$/.test(staging))) throw new Error('A HTTPS release staging endpoint is required for RC releases.')
          // Every RC build shares this version-independent channel, so an installed prior RC can find a later candidate.
          const locale = process.env.VITE_CAY_LOCALE
          if (!['zh-CN', 'en-US'].includes(locale)) throw new Error('Invalid application locale.')
          const manifest = locale === 'en-US' ? 'latest-en.json' : 'latest.json'
          const endpoints = channel === 'rc'
            ? [`${staging}/${manifest}`]
            : [`https://github.com/${repository}/releases/latest/download/${manifest}`]
          const base = JSON.parse((await import('node:fs')).readFileSync('src-tauri/tauri.conf.json','utf8'))
          const config = { productName: locale === 'en-US' ? 'Cay' : '微屿', app:{windows:base.app.windows.map(window=>({...window,title:locale==='en-US'?'Cay':'微屿'}))}, bundle: { createUpdaterArtifacts: true, windows: {nsis:{languages:[locale==='en-US'?'English':'SimpChinese'],displayLanguageSelector:false}} }, plugins: { updater: { endpoints, pubkey: publicKey } } }
          const temporaryRoot = process.env.RUNNER_TEMP
          if (!temporaryRoot) throw new Error('RUNNER_TEMP is required for release configuration.')
          if (locale === 'en-US') {
            let hooks = (await import('node:fs')).readFileSync('src-tauri/windows/hooks.nsh','utf8')
            const translations = {'浏览…':'Browse…','数据保存位置':'Library location','选择首次使用的数据文件夹':'Choose the initial library folder','微屿 · 数据保存位置':'Cay · Library location','可选择空文件夹保存笔记、附件和图片。留空使用系统默认位置。$\\r$\\n此选择仅对首次使用生效；已有资料库保持原位置，请在设置中迁移。':'Choose an empty folder for notes, attachments and images. Leave blank for the default location.$\\r$\\nApplies only to a new library. Move existing libraries in Settings.','选择空的数据文件夹':'Choose an empty library folder','请输入完整的数据文件夹路径，或留空使用默认位置。':'Enter an absolute folder path, or leave blank for the default location.','请选择空文件夹，已有文件不会被覆盖或移动。':'Choose an empty folder. Existing files will not be overwritten or moved.'}
            for(const [source,target] of Object.entries(translations).sort((a,b)=>b[0].length-a[0].length))hooks=hooks.split(source).join(target)
            if(/[\u4e00-\u9fff]/.test(hooks))throw new Error('Untranslated installer text remains.')
            const hookPath = `${temporaryRoot}/cay-english-hooks.nsh`
            writeFileSync(hookPath,hooks)
            config.bundle.windows.nsis.installerHooks=hookPath
          }
          writeFileSync(`${temporaryRoot}/simple-notes-release-config.json`, `${JSON.stringify(config)}\n`)
          NODE
      - name: Verify updater key pair can verify a newly signed probe
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          probe="$RUNNER_TEMP/simple-notes-updater-key-probe"
          printf 'Simple Notes updater key-pair probe\n' > "$probe"
          ./node_modules/.bin/tauri signer sign "$probe"
          UPDATER_PROBE_PATH="$probe" UPDATER_PROBE_SIGNATURE_PATH="$probe.sig" cargo test --quiet --manifest-path src-tauri/Cargo.toml --test verify_updater_key -- --ignored --exact release_owner_key_pair_verifies_a_signed_probe
          rm -f "$probe" "$probe.sig"
      - name: Verify native locale branding
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib brand::tests
      - name: Build localized installers and signed update payloads
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: pnpm tauri build --config "$RUNNER_TEMP/simple-notes-release-config.json" ${{ matrix.args }}
      - name: Verify universal macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -path '*/Contents/MacOS/*' -type f | head -n 1)"
          test -n "$binary"
          lipo "$binary" -verify_arch arm64 x86_64
      - name: Attach exactly the localized installer and signed update payload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v1.1.5
          RELEASE_CHANNEL: stable
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/localized-release.ts --mode package --version "${TAG_NAME#v}" --platform '${{ matrix.platform }}' --locale '${{ matrix.locale }}' --root 'src-tauri/target/${{ matrix.target }}/release/bundle' --output "$RUNNER_TEMP/cay-release-assets"
          gh release upload "$TAG_NAME" "$RUNNER_TEMP/cay-release-assets/"* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove temporary release configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/simple-notes-release-config.json" "$RUNNER_TEMP/simple-notes-updater-key-probe" "$RUNNER_TEMP/simple-notes-updater-key-probe.sig" "$RUNNER_TEMP/cay-english-hooks.nsh"
  checksums:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      verified-bundle-name: ${{ steps.bundle-name.outputs.name }}
      candidate-release: ${{ steps.release-metadata.outputs.candidate-release }}
    steps:
      - name: Check out release validation scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download draft release assets
        id: release-metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v1.1.5
        shell: bash
        run: |
          mkdir release-assets
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release-assets.json"
          echo "candidate-release=$(jq -c '{isDraft,isPrerelease,tagName}' "$RUNNER_TEMP/release-assets.json")" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js for release validation
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
      - name: Generate language-specific updater manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v1.1.5
        shell: bash
        run: |
          node --experimental-strip-types scripts/localized-release.ts --mode metadata --version "${TAG_NAME#v}" --assets "$RUNNER_TEMP/release-assets.json" --repository "$GITHUB_REPOSITORY" --output release-assets
          gh release upload "$TAG_NAME" release-assets/latest.json release-assets/latest-en.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release-assets.json"
      - name: Validate complete updater metadata and matching signatures
        env:
          TAG_NAME: v1.1.5
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node --experimental-strip-types scripts/validate-release-metadata.ts --directory release-assets --release-assets "$RUNNER_TEMP/release-assets.json" --repository "$REPOSITORY" --tag "$TAG_NAME" --identity-output release-assets/release-asset-identities.json
      - name: Generate, upload, and verify SHA256SUMS
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v1.1.5
        shell: bash
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release upload "$TAG_NAME" release-asset-identities.json SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Name immutable verified release bundle
        id: bundle-name
        shell: bash
        run: echo "name=verified-release-bundle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload immutable verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.bundle-name.outputs.name }}
          path: release-assets
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  prepare-stable-promotion:
    needs: checksums
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable promotion validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 11.21.0
      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --store-dir "${{ runner.temp }}/pnpm-store"
      - name: Download immutable verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.checksums.outputs.verified-bundle-name }}
          path: release-assets
      - name: Revalidate immutable verified release bundle
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Verify public stable baseline and write promotion plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v1.1.5
          CANDIDATE_RELEASE: ${{ needs.checksums.outputs.candidate-release }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$CANDIDATE_RELEASE" > "$RUNNER_TEMP/candidate-stable-release.json"
          curl --location --fail --silent --show-error "https://github.com/$REPOSITORY/releases/latest/download/latest.json" -o "$RUNNER_TEMP/previous-stable-latest.json"
          node --experimental-strip-types scripts/prepare-stable-promotion.ts --candidate release-assets/latest.json --previous "$RUNNER_TEMP/previous-stable-latest.json" --release "$RUNNER_TEMP/candidate-stable-release.json" --repository "$REPOSITORY" --tag "$TAG_NAME" --output stable-promotion-plan.json
      - name: Upload stable promotion and rollback plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-promotion-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: stable-promotion-plan.json
          if-no-files-found: error
          retention-days: 30
