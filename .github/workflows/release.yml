name: Signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out signed tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require a GitHub-verified annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "Release requires refs/tags/v*." >&2; exit 1 ;; esac
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.type')"
          test "$tag_type" = tag || { echo "Release tag must be annotated and signed." >&2; exit 1; }
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')"
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')"
          verified_name="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.tag')"
          test "$verified" = true || { echo "GitHub did not verify the tag signature." >&2; exit 1; }
          test "$verified_name" = "$TAG_NAME" || { echo "Verified tag name differs from the trigger." >&2; exit 1; }
      - name: Match tag and application versions
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const tag = process.env.TAG_NAME
          if (!tag || !/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/.test(tag)) {
            throw new Error('Release tag must be an exact semantic version such as v1.2.3 or v1.2.3-rc.1.')
          }
          const expected = tag.slice(1)
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version
          const tauriVersion = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8')).version
          const cargoText = readFileSync('src-tauri/Cargo.toml', 'utf8')
          const cargoVersion = cargoText.match(/^version\s*=\s*"([^"]+)"/m)?.[1]
          if ([packageVersion, tauriVersion, cargoVersion].some((version) => version !== expected)) {
            throw new Error(`Tag ${tag} does not match package (${packageVersion}), Tauri (${tauriVersion}), and Cargo (${cargoVersion}) versions.`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${expected.includes('-')}\n`)
          NODE

  build:
    needs: verify-tag
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 11.16.0
      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install macOS universal Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Windows signing secrets are required.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'simple-notes-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
      - name: Materialize release-only updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          const publicKey = process.env.TAURI_UPDATER_PUBLIC_KEY?.trim()
          if (!publicKey || publicKey.includes('PRIVATE KEY') || publicKey.includes('\n')) {
            throw new Error('A real release-owner updater public key is required.')
          }
          const required = ['TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD']
          if (process.env.RUNNER_OS === 'macOS') {
            required.push('APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID')
          }
          for (const name of required) {
            if (!process.env[name]?.trim()) throw new Error(`${name} is required for a signed release.`)
          }
          const repository = process.env.GITHUB_REPOSITORY
          if (!repository || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) {
            throw new Error('GITHUB_REPOSITORY is invalid.')
          }
          const config = {
            bundle: { createUpdaterArtifacts: true },
            plugins: {
              updater: {
                endpoints: [`https://github.com/${repository}/releases/latest/download/latest.json`],
                pubkey: publicKey,
              },
            },
          }
          if (process.env.RUNNER_OS === 'Windows') {
            const thumbprint = process.env.WINDOWS_CERTIFICATE_THUMBPRINT?.trim()
            if (!thumbprint || !/^[0-9A-Fa-f]{40}$/.test(thumbprint)) {
              throw new Error('A 40-hex Windows certificate thumbprint is required.')
            }
            config.bundle.windows = {
              certificateThumbprint: thumbprint,
              digestAlgorithm: 'sha256',
              timestampUrl: 'http://timestamp.digicert.com',
            }
          }
          const temporaryRoot = process.env.RUNNER_TEMP
          if (!temporaryRoot) throw new Error('RUNNER_TEMP is required for release configuration.')
          // The Tauri action receives this path through --config; the checked-out config stays fail-closed.
          writeFileSync(`${temporaryRoot}/simple-notes-release-config.json`, `${JSON.stringify(config)}\n`)
          NODE
      - name: Build and attach signed installers and updater metadata
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Simple Notes ${{ github.ref_name }}'
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ needs.verify-tag.outputs.prerelease }}
          uploadUpdaterJson: true
          args: --config ${{ runner.temp }}/simple-notes-release-config.json ${{ matrix.args }}
      - name: Remove temporary release configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/simple-notes-release-config.json"
      - name: Remove temporary Windows certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'simple-notes-signing.pfx') -Force -ErrorAction SilentlyContinue

  checksums:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir release-assets
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Require updater metadata and signatures
        shell: bash
        run: |
          test -f release-assets/latest.json
          find release-assets -maxdepth 1 -type f -name '*.sig' -print -quit | grep -q .
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const metadata = JSON.parse(readFileSync('release-assets/latest.json', 'utf8'))
          const platforms = metadata.platforms
          const hasSignedPlatform = platforms !== null && typeof platforms === 'object' && Object.values(platforms).some(
            (platform) => platform !== null
              && typeof platform === 'object'
              && typeof platform.url === 'string'
              && typeof platform.signature === 'string'
              && platform.signature.length > 0,
          )
          if (!hasSignedPlatform) throw new Error('latest.json has no signed updater platform metadata.')
          NODE
      - name: Generate and upload SHA256SUMS
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          gh release upload "$TAG_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
